name: RunMatch Android Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild RunMatch source archive
        shell: bash
        run: |
          cat RunMatch-v0.55.00-source.part00 RunMatch-v0.55.00-source.part01 > RunMatch-v0.55.00-source.zip
          unzip -t RunMatch-v0.55.00-source.zip

      - name: Extract RunMatch sources
        shell: bash
        run: |
          rm -rf runmatch-source
          mkdir runmatch-source
          unzip -q RunMatch-v0.55.00-source.zip -d runmatch-source
          test -f runmatch-source/build.gradle
          test -f runmatch-source/settings.gradle
          test -f runmatch-source/app/build.gradle
          test -f runmatch-source/AndroidManifest.xml
          grep -q "versionName '0.55.00'" runmatch-source/app/build.gradle
          grep -q "versionCode 294" runmatch-source/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run RunMatch JavaScript tests
        working-directory: runmatch-source
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in $(find tests -maxdepth 1 -type f -name '*_test.js' | sort); do
            node "$test_file"
            count=$((count + 1))
          done
          test "$count" -eq 163
          echo "PASS: $count/163 test files"

      - name: Validate RunMatch catalog
        working-directory: runmatch-source
        run: node tools/validate_catalog.mjs assets/catalog.json

      - name: Run regression audit
        working-directory: runmatch-source
        run: node tools/audit_regressions.cjs "$GITHUB_WORKSPACE/runmatch-source"

      - name: Run production engine sweep
        working-directory: runmatch-source
        run: node tools/production_engine_sweep.cjs "$GITHUB_WORKSPACE/runmatch-source"

      - name: Build RunMatch debug APK
        working-directory: runmatch-source
        env:
          RUNMATCH_BILLING_ENABLED: 'false'
          RUNMATCH_PREMIUM_VERIFY_URL: ''
        run: |
          gradle --no-daemon --stacktrace clean lintDebug testDebugUnitTest assembleDebug

      - name: Show full Android lint errors
        if: failure()
        working-directory: runmatch-source
        shell: bash
        run: |
          echo "===== FULL LINT ERRORS ====="
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then cat "$REPORT"; else find app/build -type f -name "*lint*.txt" -print || true; fi

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          mkdir -p build-artifacts
          cp runmatch-source/app/build/outputs/apk/debug/app-debug.apk build-artifacts/RunMatch-v0.55.00-debug.apk
          sha256sum build-artifacts/RunMatch-v0.55.00-debug.apk > build-artifacts/RunMatch-v0.55.00-debug.sha256.txt

      - name: Upload RunMatch APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RunMatch-v0.55.00-debug-apk
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14
